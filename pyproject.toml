[project]
name = "specbridge"
version = "0.0.1.dev0"
description = "Spec-Code bridge: framework-agnostic, read-only traceability analyzer for spec-driven development."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Genya Okada", email = "nekolife@gmail.com" },
]
keywords = ["spec-driven-development", "traceability", "spec", "code-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1",
    "types-PyYAML",
]
mcp = [
    "mcp>=1.0",
]
watch = [
    "watchdog>=4.0",
]
ast = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
]

[project.scripts]
specbridge = "specbridge.cli:cli"

# ── Plugin SDK ──────────────────────────────────────────────────────
# External packages register specbridge adapters via entry points:
#   [project.entry-points."specbridge.adapters"]
#   my_adapter = "my_package.my_adapter:MyAdapter"
[project.entry-points."specbridge.adapters"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specbridge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "specbridge.outputs.html"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
