# specbridge CI — pytest + mypy + ruff
#
# Run on every push and pull request to main.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ast,mcp]"

      - name: Lint (ruff)
        run: ruff check specbridge/ tests/

      - name: Type check (mypy)
        run: mypy specbridge/

      - name: Test (pytest)
        run: python -m pytest tests/ -v --tb=short --cov=specbridge --cov-report=term-missing
