name: specbridge traceability

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  specbridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install specbridge
        run: |
          pip install -e .

      - name: Verify specbridge version
        run: specbridge --version

      - name: 📸 Snapshot (baseline)
        run: specbridge snapshot
        continue-on-error: true

      - name: Run drift gate
        run: specbridge drift --gate

      - name: Run coverage gate
        run: specbridge coverage --merge --gate
